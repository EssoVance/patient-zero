<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PATIENT ZERO | BIOLUMINESCENCE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #020408;
      overflow: hidden;
      font-family: 'Space Mono', monospace;
      color: #00ffcc;
    }

    #canvas-container {
      position: fixed; inset: 0;
    }

    canvas { display: block; }

    /* ── HUD: top-left stats ── */
    #hud-stats {
      position: fixed; top: 20px; left: 20px;
      background: rgba(0,10,20,0.75);
      border: 1px solid rgba(0,255,200,0.2);
      border-radius: 4px;
      padding: 14px 18px;
      font-size: 11px;
      line-height: 1.8;
      backdrop-filter: blur(4px);
      min-width: 220px;
      z-index: 10;
    }
    #hud-stats h2 {
      font-size: 13px;
      letter-spacing: 0.15em;
      color: #00ffff;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .stat-label { color: rgba(0,255,200,0.5); }
    .stat-value { color: #00ffcc; font-weight: 700; }

    /* ── Legend: bottom-right ── */
    #legend {
      position: fixed; bottom: 24px; right: 24px;
      background: rgba(0,10,20,0.75);
      border: 1px solid rgba(0,255,200,0.2);
      border-radius: 4px;
      padding: 14px 18px;
      font-size: 11px;
      line-height: 2;
      backdrop-filter: blur(4px);
      z-index: 10;
    }
    #legend h3 {
      font-size: 11px;
      letter-spacing: 0.12em;
      color: rgba(0,255,200,0.6);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .legend-dot {
      display: inline-block;
      width: 10px; height: 10px;
      border-radius: 50%;
      margin-right: 8px;
      vertical-align: middle;
    }

    /* ── Loading spinner ── */
    #loading {
      position: fixed; inset: 0;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #020408;
      z-index: 100;
      transition: opacity 0.6s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner {
      width: 48px; height: 48px;
      border: 2px solid rgba(0,255,200,0.15);
      border-top-color: #00ffcc;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loading p {
      font-size: 12px;
      letter-spacing: 0.2em;
      color: rgba(0,255,200,0.5);
      text-transform: uppercase;
    }

    /* ── Title watermark ── */
    #watermark {
      position: fixed; top: 20px; right: 20px;
      font-size: 10px;
      letter-spacing: 0.25em;
      color: rgba(0,255,200,0.15);
      text-transform: uppercase;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Connecting to Solana…</p>
  </div>

  <div id="canvas-container"></div>

  <div id="hud-stats">
    <h2>⬡ Patient Zero</h2>
    <div><span class="stat-label">Wallets tracked: </span><span class="stat-value" id="stat-nodes">0</span></div>
    <div><span class="stat-label">Active pairs:   </span><span class="stat-value" id="stat-pairs">0</span></div>
    <div><span class="stat-label">Cascade edges:  </span><span class="stat-value" id="stat-edges">0</span></div>
    <div style="margin-top:8px;"><span class="stat-label">Top originator:</span></div>
    <div style="font-size:9px;word-break:break-all;color:#00ffff;" id="stat-top-wallet">—</div>
  </div>

  <div id="legend">
    <h3>Originator Score</h3>
    <div><span class="legend-dot" style="background:#00ffff;box-shadow:0 0 6px #00ffff;"></span><span>Genuine Originator (&gt;0.7)</span></div>
    <div><span class="legend-dot" style="background:#00ff80;box-shadow:0 0 4px #00ff80;"></span><span>Mixed / Unknown (0.4–0.7)</span></div>
    <div><span class="legend-dot" style="background:#004d20;"></span><span>Likely Follower (&lt;0.4)</span></div>
    <div><span class="legend-dot" style="background:#ffffff;box-shadow:0 0 8px #fff;"></span><span>New Pair Launch</span></div>
  </div>

  <div id="watermark">BIOLUMINESCENCE · @EssoVance</div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
